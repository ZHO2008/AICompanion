# ============================================================================
#  AI 伴侣 · 默认配置模板
#  本文件由程序在首次启动发现 config.yaml 缺失时自动生成（手册 §5.1）。
#  每一行都可以改；程序对任何缺失或为空的字段都会回退到本文件里的默认值，
#  因此删掉某个键不会导致崩溃，只会在启动气泡里提示用了兜底值。
#  路径可以写相对路径，相对于本文件所在目录解析（准则 8）。
# ============================================================================

llm:
  # 关掉它就是"纯桌面宠物"：不加载 GGUF、不拉起 llama-server、不占显存，
  # 角色显示 / 语音输出 / 语音输入照样能用（它们各有自己的开关）。
  enabled: true
  # 默认用安装包里自带的那份（models/llm/，开箱即用）。想换 7B：把 gguf 放进 models/ 后改这里即可。
  model_path: "models/llm/qwen2.5-1.5b-instruct-q4_k_m.gguf"
  host: "127.0.0.1"
  port: 8080
  context_length: 4096
  # 模型层数 L。0 = 启动时自动从 GGUF 元数据探测，无需手填。
  layer_count: 0
  # 由主程序自行拉起 llama-server（决策 Q5），因此 bat 里不再启动它。
  # 构建产物由 build_native.bat 统一复制到 bin\ 目录。
  server_executable_path: "bin/llama-server.exe"
  threads: 0
  startup_timeout_seconds: 180

tts:
  # 关掉后只弹文字气泡、不出声，也不会去探活或拉起 GPT-SoVITS 之类的服务。
  enabled: true
  # 可选："chatterbox"（外部 GPU 服务）/"gpt_sovits"（api_v2.py）/"cosyvoice"（官方 FastAPI）/"piper"（本地 CPU）
  engine: "piper"
  default_voice: "zh_CN-default" # 全局默认音色，角色缺失配置时使用
  soft_restart_hours: 4.0
  soft_restart_idle_minutes: 5.0
  chatterbox:
    host: "127.0.0.1"
    port: 5000
    launch_command: ""
    # 手册未规定 chatterbox-api 的路由，做成配置项以便按部署版本调整。
    synthesize_path: "/synthesize"
    restart_path: "/restart"
  # GPT-SoVITS：对接整合包里的 api_v2.py（默认 9880）。
  # 训练好的模型 = gpt_weights_path(*.ckpt) + sovits_weights_path(*.pth)；
  # 不填权重则用服务端当前模型做零样本，此时 ref_audio_path + prompt_text 必填。
  gpt_sovits:
    host: "127.0.0.1"
    port: 9880
    tts_path: "/tts"
    gpt_weights_path: ""
    sovits_weights_path: ""
    ref_audio_path: ""          # 3~10 秒干净人声
    prompt_text: ""             # 参考音频的原文，必须一致
    prompt_lang: "zh"
    text_lang: "zh"
    text_split_method: "cut5"
    speed_factor: 1.0
    top_k: 15
    top_p: 1.0
    temperature: 1.0
    timeout_seconds: 120        # 首次合成要建 CUDA 图，别设太短
    launch_command: ""
  # CosyVoice 2/3：对接官方 runtime/python/fastapi/server.py（默认 50000）。
  # 服务返回裸 PCM，sample_rate 必须与模型一致：CosyVoice2/3 = 24000，CosyVoice1 = 22050。
  cosyvoice:
    host: "127.0.0.1"
    port: 50000
    mode: "zero_shot"           # sft / zero_shot / cross_lingual / instruct / instruct2
    spk_id: ""                  # sft / instruct 用
    prompt_text: ""             # zero_shot / instruct2 用
    prompt_wav: ""              # zero_shot / cross_lingual / instruct2 用
    instruct_text: ""           # instruct / instruct2 用
    # CosyVoice3 的 LLM 硬性要求输入里含 <|endofprompt|>，官方写法是把它放在指令前面：
    #   prompt_prefix: "You are a helpful assistant.<|endofprompt|>"
    # 填了它，zero_shot 的 prompt_text 与 cross_lingual 的正文会自动加上；留空则原样发送（CosyVoice 1/2）。
    prompt_prefix: ""
    sample_rate: 24000
    timeout_seconds: 120
    launch_command: ""
  piper:
    model_path: "models/piper/zh_CN/model.onnx"
    library_path: "third_party/piper/build/piper.dll"
    executable_path: "tools/piper/piper.exe"
    espeak_data_path: "third_party/piper/espeak-ng-data"

asr:
  # 关掉后不载识别模型、不打开麦克风，也不占用全局按住说话热键。
  enabled: true
  # 手册模板此处写作 "models/asr/..."，那是占位符；这里给出可用默认值。
  model_path: "models/asr/ggml-base.bin"
  # ASR 引擎动态库：third_party/ai_asr 构建出的桥接层（内部静态链接 whisper.cpp）。
  library_path: "bin/ai_asr.dll"
  language: "zh"
  threads: 0                     # 0 = 由引擎决定
  sample_rate: 16000
  vad_mode: "auto"               # auto / webrtc / energy
  # WebRTC VAD 动态库（third_party/fvad_shim 把 libfvad 打成带导出符号的 DLL）。
  # 文件不存在时 auto 模式会自动回退到能量 VAD。
  vad_library_path: "bin/libfvad.dll"
  vad_aggressiveness: 2
  energy_threshold: 0.02
  silence_milliseconds: 700
  min_speech_milliseconds: 250
  max_segment_seconds: 15

live2d:
  # 三级兜底：角色模型 → 全局默认模型 → 静态贴图 → 纯色背景+角色名
  default_model_path: "./Hiyori/Hiyori.model3.json"
  default_texture_path: "./Assets/Default/default.png"
  expression_directory: "./Assets/Default/Expressions"

knowledge:
  directory: "./Knowledge"
  pending_directory_name: ".pending"
  notify_threshold: 10
  pending_retention_days: 90
  notify_state_file_name: ".notify_state.json"

logging:
  chat_log_dir: "./logs/chat"
  app_log_dir: "./logs/app"
  max_log_days: 90
  minimum_level: "Info"

# ---------------------------- 以下为手册正文常量的外提 ----------------------------
# 手册把这些数值写死在描述里；按准则 8 不得硬编码，故集中到此处。
# 默认值等于手册正文的取值，因此行为与手册一致。

monitor:
  host: "127.0.0.1"
  port: 47777                    # 决策 Q10：GameMonitor TCP 端口
  heartbeat_interval_seconds: 10
  disconnect_timeout_seconds: 30
  cooldown_minutes: 5.0          # 决策 Q11：恢复后的冷却期
  game_list_file: "game_list.txt"
  scan_interval_idle_seconds: 60
  scan_interval_active_seconds: 10
  unload_gpu_threshold_percent: 80
  restore_gpu_threshold_percent: 50
  restore_low_gpu_minutes: 3.0

gpu:
  reserved_mb: 4096              # 系统预留 4GB
  kv_cache_reserved_mb: 1024     # KV Cache 预留 1GB
  per_layer_mb: 150              # 每层约 150MB
  safety_factor: 0.9
  max_oom_retries: 2
  oom_ngl_step: 4
  oom_retry_delay_seconds: 5

context:
  max_recent_rounds: 30
  send_recent_rounds: 10
  summary_token_limit: 500
  anchor_limit: 30
  refine_window_size: 200
  archive_file_name: "chat_log_archive.jsonl"
  personality_entry_limit: 10

idle:
  poll_interval_ms: 500
  idle_minutes: 5.0
  cpu_low_percent: 50.0
  cpu_high_percent: 70.0
  refine_gpu_memory_percent: 60.0
  # 一轮维护结束后隔多少分钟才允许下一轮。
  # 维护本身会把 llama-server 拉满，CPU 一高又会被取消；没有冷却会变成
  # "启动 → CPU 超 70% → 取消 → 立刻再启动" 的死循环（实测每秒一轮）。
  maintenance_cooldown_minutes: 10.0

ui:
  fallback_display_name: "AI 伴侣"
  fallback_background_color: "#FF2B2B3C"
  pet_image_path: "./Assets/Default/default.png"
  always_on_top: true
  # 启动时是否处于「透明」（鼠标穿透）模式。
  # 默认 false = 启动即为「覆盖」（可交互），否则收不到左键/右键，
  # 也就无法用"左键开功能栏、右键切换模式"的交互。
  click_through: false
  # 角色大小倍率：0 = 按屏幕自动适配（推荐），否则为固定倍率（0.5 - 2.5）。
  #
  # 为什么要这个：分辨率和 DPI 换一台机器就变。同一块 2560x1440 屏，
  # 100% 缩放下逻辑分辨率是 2560x1440，175% 缩放下只有 1463x823 ——
  # 460 DIP 的角色窗口分别占屏幕高度的 32% 和 56%。
  # 运行中可用功能栏的 −/＋ 或 Ctrl+滚轮调整，调整结果会记到 Assets\appearance.json。
  scale: 0
  # 透明（穿透）态下鼠标悬停到角色身上时自动切回「覆盖」。
  # 原理：穿透态收不到 WM_MOUSEMOVE，只能用轮询光标 + 像素级命中判定。
  transparent_hover_switch: true
  # 悬停持续多少毫秒才切换（0 = 一进入就切），用来避免鼠标扫过就触发。
  transparent_hover_delay_ms: 250
  # 由悬停切到覆盖后，鼠标离开角色多少秒自动回到透明（0 = 不自动回退）。
  # 只对悬停触发的切换生效；右键手动切换的模式不会被自动改掉。
  transparent_auto_revert_seconds: 3
  # 检测到前台全屏程序（游戏、全屏视频）时：
  #   进全屏 → 自动切成「透明」（鼠标穿透）并暂停悬停自动切换，免得角色挡住画面、抢走点击；
  #   退全屏 → 恢复成全屏前的模式。
  # 全屏期间仍然可以点右上角按钮手动切换，且以你的选择为准。
  fullscreen_quiet_mode: true
  bubble_duration_seconds: 5
  # 透明（穿透）态下角色整体的不透明度，让两种模式一眼可辨：
  # 覆盖态恒为 1.0（完全不透明），透明态降到该值（0.1 - 1.0）。
  transparent_opacity: 0.5
  # 表情停留时间（秒）：表情图是整张替换立绘，到期后自动回到默认形象。
  # 0 表示不回退（角色会停在最后一次的表情上）。
  expression_hold_seconds: 8
  # 闲置兜底：最后一次交互（说话/点击/拖动）之后多少秒把表情切回默认立绘。
  # 0 表示关闭这条规则；它与上面那条互补，用来兜住 hold 设成 0 或设得过长的情况。
  idle_expression_seconds: 20
